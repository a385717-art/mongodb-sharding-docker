services:
  # servidor de configuracion (guarda los metadatos del cluster)
  configsvr:
    image: mongo:7.0.45
    container_name: configsvr
    command: --configsvr --replSet configReplSet --port 27017
    ports:
      - 28017:27017
    volumes:
      # con --configsvr mongo guarda los datos en /data/configdb, no en /data/db
      - configsvr:/data/configdb
      - ./scripts:/scripts:ro
    networks:
      - mongo-cluster

  # shard 1
  shard1:
    image: mongo:7.0.45
    container_name: shard1
    command: --shardsvr --replSet shard1ReplSet --port 27018
    ports:
      - 28018:27018
    volumes:
      - shard1:/data/db
      - ./scripts:/scripts:ro
    networks:
      - mongo-cluster

  # shard 2
  shard2:
    image: mongo:7.0.45
    container_name: shard2
    command: --shardsvr --replSet shard2ReplSet --port 27019
    ports:
      - 28019:27019
    volumes:
      - shard2:/data/db
      - ./scripts:/scripts:ro
    networks:
      - mongo-cluster

  # shard 3 (mismo patron que los otros dos)
  shard3:
    image: mongo:7.0.45
    container_name: shard3
    command: --shardsvr --replSet shard3ReplSet --port 27021
    ports:
      - 28021:27021
    volumes:
      - shard3:/data/db
      - ./scripts:/scripts:ro
    networks:
      - mongo-cluster

  # router, aqui es donde se conecta el cliente
  mongos:
    image: mongo:7.0.45
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
      - shard3
    command: >
      mongos --configdb configReplSet/configsvr:27017 --bind_ip_all --port 27020
    ports:
      - 28020:27020
    volumes:
      - ./scripts:/scripts:ro
      - ./crud:/crud:ro
    networks:
      - mongo-cluster

volumes:
  configsvr:
  shard1:
  shard2:
  shard3:

networks:
  mongo-cluster:
    driver: bridge
